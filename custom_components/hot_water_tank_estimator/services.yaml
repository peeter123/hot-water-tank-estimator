set_tank_state:
  target:
    entity:
      integration: hot_water_tank_estimator
  fields:
    tank_average:
      selector:
        number:
          min: 0
          max: 110
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    charged_temperature:
      selector:
        number:
          min: 0
          max: 110
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
recalibrate:
  target:
    entity:
      integration: hot_water_tank_estimator
  fields:
    days:
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: days
          mode: box
